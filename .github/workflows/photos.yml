name: Process photos

# Runs when photos are uploaded to assets/photos/ (e.g. via GitHub's "Upload files" page).
on:
  push:
    branches: [master]
    paths:
      - "assets/photos/**"
      - "!assets/photos/index.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pillow-heif
      - run: python .github/scripts/process_photos.py
      - name: Commit processed photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/photos
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Process uploaded photos"
          git push
