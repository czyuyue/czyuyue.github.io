<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photography · Yue Yu</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">Yue Yu</a>
      <nav>
        <a href="index.html">About</a>
        <a href="index.html#publications">Publications</a>
        <a href="photography.html" aria-current="page">Photography</a>
      </nav>
    </div>
  </header>

  <main class="page-wide">
    <h1 class="page-title">Photography</h1>
    <p class="page-sub">Birds, plants, and places. 🐦 🌿</p>

    <!--
      Photos are listed in assets/photos/index.json, which a GitHub Action rebuilds
      whenever files are uploaded to assets/photos/ (see .github/workflows/photos.yml).
      Captions come from file names, e.g. "Kingfisher, Beijing 2026.jpg".
    -->
    <div class="gallery" id="gallery"></div>

    <footer style="margin-top: 40px">
      <span>© 2026 Yue Yu</span>
      <span>All photos by Yue Yu</span>
    </footer>
  </main>

  <div class="lightbox" id="lightbox"><img alt=""></div>
  <script>
    var box = document.getElementById("lightbox");
    var boxImg = box.querySelector("img");
    function openBox(img) { boxImg.src = img.src; boxImg.alt = img.alt; box.classList.add("open"); }
    box.addEventListener("click", function () { box.classList.remove("open"); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") box.classList.remove("open"); });

    var gallery = document.getElementById("gallery");
    fetch("assets/photos/index.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (photos) {
        photos.forEach(function (p) {
          var fig = document.createElement("figure");
          var img = document.createElement("img");
          img.src = encodeURI(p.src);
          img.alt = p.caption || "Photo by Yue Yu";
          img.loading = "lazy";
          if (p.w && p.h) img.style.aspectRatio = p.w + " / " + p.h;
          img.addEventListener("click", function () { openBox(img); });
          fig.appendChild(img);
          if (p.caption) {
            var cap = document.createElement("figcaption");
            cap.textContent = p.caption;
            fig.appendChild(cap);
          }
          gallery.appendChild(fig);
        });
        if (!photos.length) gallery.outerHTML = "<p class=\"page-sub\">Photos coming soon.</p>";
      })
      .catch(function () { gallery.outerHTML = "<p class=\"page-sub\">Photos coming soon.</p>"; });
  </script>
</body>
</html>
